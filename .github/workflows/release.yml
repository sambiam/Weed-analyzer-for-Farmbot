name: Publish release image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version from config.yaml
        id: addon_version
        run: |
          VERSION=$(grep -m1 '^version:' farmbot_vision/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from farmbot_vision/config.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches config.yaml version
        env:
          VERSION: ${{ steps.addon_version.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # The Supervisor pulls the image tag from config.yaml's `version`
          # field, not the release tag name. If a release is published from a
          # commit that predates the matching version bump (e.g. the tag was
          # cut before "bump version" merged), this job would silently build
          # and publish an image tagged with the *old* version while
          # config.yaml on main already advertises the new one -- leaving
          # Supervisor unable to find the update it just offered (404
          # manifest unknown). Fail loudly instead so the release can be
          # re-cut from the correct commit.
          NORMALIZED_TAG=${TAG_NAME#v}
          NORMALIZED_TAG=${NORMALIZED_TAG#V}
          if [ "$NORMALIZED_TAG" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' does not match config.yaml version '$VERSION'. This release was likely cut from a commit that predates the version bump. Re-cut the release from the commit where config.yaml was updated to $NORMALIZED_TAG."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sambiam/farmbot-vision
          tags: |
            # The tag Supervisor pulls MUST match config.yaml's `version` field
            # exactly, so it is sourced from config.yaml rather than the Git
            # release tag name (which need not be semver, e.g. V1.0_alpha).
            type=raw,value=${{ steps.addon_version.outputs.version }}
            type=raw,value=${{ github.event.release.tag_name }}
            # config.yaml uses the registry default tag for normal releases.
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - uses: docker/build-push-action@v6
        with:
          context: farmbot_vision
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.addon_version.outputs.version }}
            BUILD_ARCH=aarch64|amd64
          provenance: mode=max
          sbom: true
